name: E2E

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter @circles/frontend exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @circles/frontend run test:e2e
