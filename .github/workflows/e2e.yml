name: E2E

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: circles
          POSTGRES_PASSWORD: password
          POSTGRES_DB: circles_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U circles -d circles_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://circles:password@127.0.0.1:5432/circles_dev
      BETTER_AUTH_SECRET: ci-better-auth-secret-32-characters
      FRONTEND_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm vp run @circles/backend#pg:migrate

      - name: Install Playwright browsers
        run: pnpm vp exec playwright install --with-deps chromium
        working-directory: apps/frontend

      - name: Run E2E tests
        run: pnpm vp run @circles/frontend#test:e2e
