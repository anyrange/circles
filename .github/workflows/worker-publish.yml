name: Docker

on:
  push:
    branches:
      - master

  workflow_dispatch:

env:
  IMAGE_NAME: worker

jobs:
  # Push image to GitHub Packages.
  # See also https://docs.docker.com/docker-hub/builds/
  push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Log into registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login docker.pkg.github.com -u ${{ github.actor }} --password-stdin

      - name: Get the latest tag
        id: latest_tag
        uses: actions/github-script@v3
        with:
          result-encoding: string
          script: |
            const { data: tags } = await github.repos.listTags({
              ...context.repo,
              per_page: 1,
              page: 1,
            });

            const latestTag = tags[0] && tags[0].name;

            return latestTag || "";

      - name: Build image
        run: |
          IMAGE_ID=docker.pkg.github.com/${{ github.repository }}/$IMAGE_NAME

          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's/[\/-]/_/g')

          # Use Docker `standalone` tag convention
          [ "$VERSION" == "refs_heads_master" ] && VERSION=standalone

          # Create server version tag
          LATEST_TAG=${{ steps.latest_tag.outputs.result }}
          SHA=${{ github.workflow_sha }}
          VERSION_TAG=${LATEST_TAG}.${SHA::8}::${VERSION}

          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          echo VERSION_TAG=$VERSION_TAG
          
          docker pull $IMAGE_ID:standalone
          docker build . --file Dockerfile --tag $IMAGE_ID:$VERSION --cache-from $IMAGE_ID:standalone --build-arg VERSION_TAG=$VERSION_TAG

          docker push $IMAGE_ID:$VERSION
