services:
  postgres:
    image: postgres:16
    container_name: circles-postgres
    command: postgres -c 'max_connections=200'
    restart: always
    environment:
      POSTGRES_USER: circles
      POSTGRES_PASSWORD: password
      POSTGRES_DB: circles_dev
    ports:
      - "5432:5432"
    volumes:
      - circles_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d circles_dev -U circles"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio
    container_name: circles-minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: circles
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - circles_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  circles_postgres_data:
  circles_minio_data:
